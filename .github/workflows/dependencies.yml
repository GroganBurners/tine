name: Dependency Version Check

on:
  schedule:
    - cron: '0 20 * * 5'

jobs:
  outdated:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'renovate') == false
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: "3.14"

    - name: pip install
      run: pip install -r requirements.txt --user

    - name: outdated
      run: |
        python -m pip list --outdated --not-required --user --format=json > outdated.json
        python - <<'PY'
        import json
        import sys

        with open("outdated.json") as report:
            outdated = json.load(report)
        for package in outdated:
            print(f"{package['name']}: {package['version']} -> {package['latest_version']}")
        print("there are outdated packages" if outdated else "all packages up to date")
        sys.exit(bool(outdated))
        PY
